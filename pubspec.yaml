name: castcircle
description: "CastCircle - Help actors learn their lines"
publish_to: 'none'
version: 0.1.1+146

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # File handling
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^10.1.4

  # Audio
  just_audio: ^0.10.0
  # Direct dep (already transitive via just_audio) so we can force the iOS
  # AVAudioSession to .playback before playing recordings — rehearsal capture
  # leaves it in .record, which makes just_audio play silently.
  audio_session: ^0.2.3
  record: ^5.2.1
  # On-device streaming ASR (Zipformer transducer) for live line matching where
  # the platform recognizer can't share the mic (Android) — see
  # docs/ANDROID_LIVE_MATCHING.md. The app owns the mic and fans PCM out to the
  # recording and to this recognizer.
  sherpa_onnx: ^1.13.4
  # Direct dep (already transitive via sherpa_onnx): the Kokoro synthesis
  # isolate shares a native cancel flag with the main isolate so a superseded
  # line can abort mid-generate (isolates share no Dart memory; FFI memory is
  # process-wide).
  ffi: ^2.1.0

  # PDF rendering (for OCR pipeline)
  pdfrx: ^2.2.24

  # OCR (on-device)
  google_mlkit_text_recognition: ^0.14.0

  # TTS (system fallback when Kokoro MLX unavailable)
  flutter_tts: ^4.2.0

  # STT uses a custom platform channel (AppleSttPlugin / AndroidSttPlugin)

  # Backend
  supabase_flutter: ^2.8.2

  # Persistent preferences
  shared_preferences: ^2.3.4

  # Connectivity
  connectivity_plus: ^6.1.0

  # Deep links
  app_links: ^6.3.3
  qr_flutter: ^4.1.0

  # Contacts — using native platform channel (flutter_contacts crashes on iOS 26 beta)

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  archive: ^4.0.9
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3
  firebase_performance: ^0.11.1+5
  package_info_plus: ^9.0.0
  wakelock_plus: ^1.5.1
  simple_spell_checker: ^1.3.1
  simple_spell_checker_en_lan: ^1.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/test_scripts/
    - assets/paddle_ocr/
    - assets/ocr/
